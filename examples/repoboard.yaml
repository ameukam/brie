apiVersion: board.gemini.google.com/v1alpha1
kind: RepoBoard
metadata:
  name: brie
spec:
  repoURL: https://github.com/ameukam/brie
  auto:
    rules: []
    excludeLabels:
      - no-agent
  ready:
    approvals: 2
    requiredChecks: true
  policy:
    autoIterate: false
    disclose: true
  limits:
    maxActive: 1
  sandbox:
    engine: gemini
